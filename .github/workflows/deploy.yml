name: Deploy

on:
  push:
    branches: [main]
  # Manual run from the Actions tab. Leave "tag" blank to build + deploy the
  # selected branch, or give a previous git SHA to roll back to that image.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag (git SHA) to redeploy. Blank = build fresh."
        required: false
        default: ""

# Never run two deploys at once; queue them instead of cancelling mid-deploy
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jeremyhamning/website

jobs:
  build:
    # Skipped when rolling back to an existing tag
    if: ${{ !inputs.tag }}
    # Native arm64 runner, so no QEMU emulation is needed for the EC2 image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Typecheck + Vite build both run inside the Dockerfile's build stage
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Run after a successful build, or directly when build was skipped (rollback)
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      id-token: write # lets the job exchange a GitHub OIDC token for AWS creds
    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pull and restart on EC2 via SSM
        env:
          TAG: ${{ inputs.tag || github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # Shell script that runs as root on the instance.
          # DOCKER_CONFIG points at the creds from the one-time `docker login ghcr.io`.
          params=$(jq -n --arg tag "$TAG" '{commands: [
            "set -eu",
            "export DOCKER_CONFIG=/root/.docker",
            "cd /opt/website",
            "export IMAGE_TAG=\($tag)",
            "docker compose pull",
            "docker compose up -d --remove-orphans",
            "docker image prune -f"
          ]}')

          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy website $TAG" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"

          # Wait for the remote script; capture failure so we can print its output first
          status=0
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$INSTANCE_ID" || status=$?

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '{Status: Status, Stdout: StandardOutputContent, Stderr: StandardErrorContent}' \
            --output yaml
          exit $status
